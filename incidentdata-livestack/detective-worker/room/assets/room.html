<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Detective Room</title><style>
/*__ROOM_CSS__*/
#detective-room .name-placeholder{height:104px;display:flex;align-items:center;justify-content:center;background:#cad0bb;font:32px ui-monospace,monospace;color:#344335}
#detective-room .focused-board .name-placeholder{height:169px}
#detective-room .all-records{margin-top:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#detective-room .record-card{border:1px solid #4f634c;background:#24382c;padding:15px;text-align:left;font-size:12px;overflow-wrap:anywhere}
#detective-room .record-card span{display:block;color:#aebea6;margin-top:8px;font:10px ui-monospace,monospace}
#detective-room .board-links{margin-top:18px;color:#bac7b0;font-size:12px}
#detective-room .board-links li{margin:8px 0}
#detective-room .data-empty{padding:24px;color:#bec9b3;background:#213128}
@media(max-width:800px){#detective-room .all-records{grid-template-columns:1fr}}
</style></head><body><main id="detective-room" aria-label="Virtual detective room"></main>
<dialog id="evidence-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><div><div class="dialog-kicker" id="dialog-kind"></div><h2 id="dialog-title"></h2></div><button type="button" class="dialog-close" autofocus>Close ×</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<script>
(()=>{'use strict';
const D=/*__ROOM_DATA__*/;
const root=document.getElementById('detective-room'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],dialog=document.getElementById('evidence-dialog');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=p=>'evidence/'+p.split('/').map(encodeURIComponent).join('/');
const colors={blue:'#79bed0',gold:'#dcaf64',red:'#df776c'};
const state={view:'room',conversation:'all',sender:'all'};
const views=['room','board',...D.panels.map(p=>p.id),...(D.messages.length?['messages']:[]),...(D.photos.length?['gallery']:[]),'sources',...(D.briefing?['briefing']:[])];
const navs=[['room','Room overview'],['board','Crime board'],...D.panels.map(p=>[p.id,p.label]),...(D.messages.length?[['messages','Messaging']]:[]),...(D.photos.length?[['gallery','Scene gallery']]:[])];
const head=(tag,title,intro)=>`<div class="section-head"><div><div class="eyebrow">${E(tag)}</div><h3>${E(title)}</h3><p>${E(intro)}</p></div></div>`;
const status=D.synthetic?'SYNTHETIC TRAINING':'INVESTIGATION ROOM';
document.title=D.title+' · Virtual Detective Room '+D.version;
root.setAttribute('aria-label',D.title+' virtual detective room');
root.innerHTML=`<header class="topbar"><div class="brand"><div class="room-no" aria-hidden="true">VR</div><div><div class="eyebrow">Virtual Detective Room · ${E(D.version)}</div><h2>CASE DETECTIVE TEAM</h2></div></div><div class="status">${status}</div></header><div class="masthead"><div><div class="eyebrow muted">${E(D.subtitle)}</div><h2>${E(D.title)}</h2><div class="case-id mono">${E(D.batch_id)}</div><p class="intro-copy">${E(D.focus)}</p></div><div class="mast-actions">${D.briefing?`<button class="register-button" type="button" data-view="briefing">▶ Video briefing · ${E(D.briefing.durationLabel)}</button>`:''}<button class="register-button" type="button" data-view="sources">Evidence register ↗</button></div></div><nav class="nav" aria-label="Investigation room views">${navs.map(([id,label],i)=>`<button type="button" data-view="${E(id)}" aria-pressed="${id==='room'}">${String(i).padStart(2,'0')} · ${E(label)}</button>`).join('')}</nav>
<section class="scene" data-panel="room" aria-label="Industrial room with evidence board ahead and analytical side walls"><div class="ceiling" aria-hidden="true"></div><div class="beam" aria-hidden="true"></div><div class="pipe" aria-hidden="true"></div><div class="lamp one" aria-hidden="true"></div><div class="lamp two" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div><div class="hazard" aria-hidden="true"></div><section class="side-wall left-wall"><div class="wall-name">Left / Analytical wall</div><button class="side-screen" type="button" data-view="${E(D.leftWall.view)}"><div class="screen-top">${E(D.leftWall.title)}<span>${E(D.leftWall.subtitle)}</span></div><div class="mini-flow">${D.leftWall.html}</div><div class="screen-bottom">Explore the analytical wall ↗</div></button><div class="wall-plaque">${E(D.leftWall.footnote)}</div></section><section class="front-wall"><div class="wall-name"><span>Front / Crime board</span><button type="button" data-view="board">Step closer ↗</button></div><div class="board-mount"></div><div class="wall-legend"><span><i class="legend-dot blue"></i>Source-backed links</span><span><i class="legend-dot gold"></i>Records / references</span><span><i class="legend-dot"></i>Source grouping</span></div></section><section class="side-wall right-wall"><div class="wall-name">Right / ${D.messages.length?'Communications':'Evidence'}</div><button class="side-screen" type="button" data-view="${D.messages.length?'messages':'sources'}"><div class="screen-top">${D.messages.length?'MESSAGE PATTERNS':'SOURCE REGISTER'}<span>${D.messages.length?`${D.messages.length} messages · ${D.conversations.length} conversations`:`${D.files.length} verified files`}</span></div><div class="mini-message" id="mini-senders"></div><div class="screen-bottom">Explore sources ↗</div></button></section><div class="mobile-wall-links"><button type="button" data-view="${E(D.leftWall.view)}">← Analytical wall</button><button type="button" data-view="${D.messages.length?'messages':'sources'}">${D.messages.length?'Messaging':'Evidence'} →</button></div><div class="scene-footer">READ-ONLY EVIDENCE ROOM / ${E(D.snapshot)}</div><div class="workbench" aria-hidden="true"><div class="bench-folder">CASE FILE<br>${E(D.version)}</div><div class="bench-paper"></div><div class="bench-cup"></div></div></section>
<section class="workspace" data-panel="board" hidden>${head('Front wall','Crime board','Select any reference, image or conversation pin to inspect its source.')}<div class="focused-board"><div class="board-mount"></div><p class="board-qualification">Cords have the source meanings listed below. They do not independently establish identities, criminal roles or events.</p></div><ul class="board-links">${D.board.links.map(l=>`<li>${E(l.label)}</li>`).join('')}</ul></section>
${D.panels.map(p=>`<section class="workspace" data-panel="${E(p.id)}" hidden>${head('Analytical workspace',p.title,p.intro)}${p.html}</section>`).join('')}
<section class="workspace" data-panel="messages" hidden>${head('Communications wall','Messaging patterns','Filter the complete supplied extract. Links show source participation, not read receipts or proven meetings.')}<div id="thread-cards" class="thread-grid"></div><div id="sender-chips" class="sender-strip"></div><div class="filters"><label>Conversation <select id="conversation-filter"></select></label><label>Sender <select id="sender-filter"></select></label><button type="button" class="reset-button" data-reset="messages">Clear filters</button></div><div id="message-count" class="message-count" aria-live="polite"></div><div id="message-list" class="message-list"></div></section>
<section class="workspace" data-panel="gallery" hidden>${head('Scene gallery','Supplied scene images','Captions and identity/time qualifications follow the source. Select an image for its original file.')}<div id="scene-gallery" class="gallery-grid"></div></section>
<section class="workspace" data-panel="sources" hidden>${head('Evidence register','Sources, checks & limitations','Original archive and registered evidence files have been verified by SHA-256 and byte count.')}<div id="source-grid" class="source-grid"></div><div class="source-note">Archive: ${E(D.archive.filename)}<br>${D.archive.bytes.toLocaleString()} bytes · SHA-256 ${E(D.archive.sha256)}<br>Snapshot: ${E(D.snapshot)}. No live refresh.</div><div id="source-notes">${D.notes.map(n=>`<div class="source-note">${E(n)}</div>`).join('')}</div>${D.excludedMetadata.length?`<div class="source-note">Excluded operating-system metadata:<br>${D.excludedMetadata.map(E).join('<br>')}</div>`:''}${D.records.length?`<h3 style="margin-top:25px">Complete source-record index</h3><div class="all-records">${D.records.map(r=>`<button type="button" class="record-card" data-record="${E(r.id)}">${E(r.title)}<span>${E(r.source)}</span></button>`).join('')}</div>`:''}</section>
${D.briefing?`<section class="workspace" data-panel="briefing" hidden>${head('Team briefing',D.title+' · '+D.briefing.durationLabel,'Matching existing briefing included unchanged.')}<video id="briefing-video" class="briefing-video" controls playsinline preload="none" poster="briefing/Case-Overview-Poster.jpg"><source src="briefing/Case-Overview.mp4" type="video/mp4"></video><div class="briefing-links"><a href="briefing/Case-Overview.html">Open chapter player ↗</a><a href="briefing/Case-Overview.mp4" download>Download video</a><a href="briefing/Case-Overview-Transcript.md" download>Transcript & sources</a></div></section>`:''}<div class="room-notice">${E(D.disclaimer)} This is a local evidence room, not a live database connection.</div><footer class="bottom-bar"><span>${D.files.length} VERIFIED FILES / ${D.people.filter(p=>p.image).length} REFERENCE PORTRAITS</span><span>SNAPSHOT · ${E(D.snapshot)}</span></footer>`;
function board(){const bs=D.board;return `<div class="pinboard"><svg class="cords" aria-hidden="true"></svg>${bs.people.length?`<div class="board-people">${bs.people.map(id=>{const p=D.people.find(p=>p.id===id);return `<button class="pin person-pin" type="button" data-person="${E(id)}" data-pin="${E('person:'+id)}">${p.image?`<img src="${p.image}" alt="${E(p.name)} reference portrait">`:`<div class="name-placeholder" aria-hidden="true">${E(p.name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''))}</div>`}<strong>${E(p.name)}</strong><span class="pin-ref">SOURCE REFERENCE</span></button>`;}).join('')}</div>`:''}${bs.conversations.length?`<div class="board-threads">${bs.conversations.map((id,i)=>{const c=D.conversations.find(c=>c.id===id);return `<button class="pin thread-pin" type="button" data-conversation="${E(id)}" data-pin="${E('conversation:'+id)}" style="--thread-color:${Object.values(colors)[i%3]}">${E(c.id)}<span>${E(c.title)}</span></button>`;}).join('')}</div>`:''}<div class="board-stamp">REFERENCE LINKS / VERIFY THE SOURCE BASIS<br>SCENE APPEARANCE ALONE DOES NOT ESTABLISH IDENTITY OR WRONGDOING</div>${bs.photos.length?`<div class="board-photos">${bs.photos.map(file=>{const p=D.photos.find(p=>p.path===file);return `<button class="pin photo-pin" type="button" data-photo="${E(file)}" data-pin="${E('photo:'+file)}"><img src="${p.image}" alt="${E(p.title)}"><strong>${E(p.title)}</strong><span class="pin-ref">SOURCE SCENE</span></button>`;}).join('')}</div>`:''}<div class="board-docs"><button class="pin doc-pin" type="button" data-view="sources">SOURCE REGISTER ↗</button><button class="pin doc-pin" type="button" data-view="${D.photos.length?'gallery':'sources'}" data-pin="source:images">${D.photos.length} ORIGINAL SCENES ↗</button></div></div>`;}
$$('.board-mount').forEach(m=>m.innerHTML=board());
function cords(){for(const b of $$('.pinboard')){if(!b.offsetWidth)continue;const svg=b.querySelector('svg'),base=svg.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.clientWidth} ${b.clientHeight}`);const anchor=id=>{const r=[...b.querySelectorAll('[data-pin]')].find(e=>e.dataset.pin===id).getBoundingClientRect();return [r.left+r.width/2-base.left,r.top+4-base.top];};svg.innerHTML=D.board.links.map((l,i)=>{const a=anchor(l.from),z=anchor(l.to);return `<path d="M${a[0]} ${a[1]} Q${(a[0]+z[0])/2+(i%3-1)*16} ${(a[1]+z[1])/2+12} ${z[0]} ${z[1]}" stroke="${colors[l.color]}"/>`;}).join('');}}
const senders=[...new Set(D.messages.map(m=>m.sender))],counts=Object.fromEntries(senders.map(s=>[s,D.messages.filter(m=>m.sender===s).length]));
$('#mini-senders').innerHTML=senders.slice(0,6).map(s=>`<div class="mini-person"><span>${E(s)}</span><b>${counts[s]}</b></div>`).join('')+`<div class="mini-sub">${senders.length>6?'Top display limited to six labels. ':''}${D.messages.length?'Counts are messages sent. Full extract inside.':'Original files, hashes and source notes inside.'}</div>`;
function details(kind,title,html){document.getElementById('dialog-kind').textContent=kind;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;dialog.querySelector('.dialog-close').focus();}
const list=xs=>xs.map(E).join('<br>');
function photo(file){const p=D.photos.find(p=>p.path===file);if(p)details('Original scene asset',p.title,`<img class="detail-image" src="${p.image}" alt="${E(p.title)}"><p>${E(p.note)}</p><p class="detail-source">${E(p.path)}<br>${p.bytes.toLocaleString()} original bytes<br>SHA-256 ${p.sha256}</p><a href="${href(p.path)}" download>Download unmodified original</a>`);}
function person(id){const p=D.people.find(p=>p.id===id);if(p)details('Reference identity / source attribution',p.name,`<div class="portrait-detail">${p.image?`<img src="${p.image}" alt="${E(p.name)} reference portrait">`:'<p>No reference portrait supplied.</p>'}<div><p>${E(p.detail)}</p><p class="detail-source">${E(p.id)}<br>${list(p.sourceRefs)}${p.sha256?'<br>Portrait SHA-256 '+p.sha256:''}</p><p>Reference metadata is not a facial-identification finding.</p></div></div>`);}
const messageHTML=m=>`<article class="source-message"><div class="meta">${E(m.id)} · ${E(m.timeLabel)}<br>${E(m.timeBasis)} · ${E(m.sender)}</div><p>${E(m.text)}</p><p class="detail-source">${E(m.source)}</p></article>`;
function conversation(id){const c=D.conversations.find(c=>c.id===id);if(c)details('Source conversation',c.title,`<p>${E(c.summary)}</p><p class="detail-source">${list(c.sourceRefs)}<br>Participants: ${c.participants.map(E).join(', ')}</p>${D.messages.filter(m=>m.conversation===id).map(messageHTML).join('')}<div class="thread-actions"><button type="button" data-open-thread="${E(id)}">Show in messaging wall →</button></div>`);}
function message(id){const m=D.messages.find(m=>m.id===id);if(m)details('Exact source message',m.id,`${messageHTML(m)}<div class="thread-actions"><button type="button" data-conversation="${E(m.conversation)}">Read conversation context →</button></div>`);}
function record(id){const r=D.records.find(r=>r.id===id);if(r)details('Source record',r.title,`<p class="detail-source">${E(r.id)} · ${E(r.source)}</p><dl>${Object.entries(r.fields).map(([k,v])=>`<dt>${E(k)}</dt><dd>${E(typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl><p style="margin-top:20px">${E(r.note)}</p>`);}
function source(file){const f=D.files.find(f=>f.path===file);if(!f)return;if(D.photos.some(p=>p.path===file))return photo(file);details('Verified original source',file,`<p class="detail-source">${f.bytes.toLocaleString()} bytes · SHA-256 ${f.sha256}</p>${f.text!==null?`<pre>${E(f.text)}</pre>`:'<p>Binary source file; use the original download.</p>'}<a href="${href(f.path)}" download>Download unmodified original</a>`);}
$('#thread-cards').innerHTML=D.conversations.map((c,i)=>`<button class="thread-card" type="button" data-filter-thread="${E(c.id)}" style="--thread-color:${Object.values(colors)[i%3]}" aria-pressed="false"><span>${E(c.id)}</span><strong>${E(c.title)}</strong><small>${c.participants.map(E).join(' · ')}<br>${D.messages.filter(m=>m.conversation===c.id).length} messages</small></button>`).join('');
$('#sender-chips').innerHTML=senders.map(s=>`<button type="button" class="sender-chip" data-sender="${E(s)}">${E(s)} <b>${counts[s]}</b></button>`).join('');
$('#conversation-filter').innerHTML='<option value="all">All conversations</option>'+D.conversations.map(c=>`<option value="${E(c.id)}">${E(c.title)}</option>`).join('');$('#sender-filter').innerHTML='<option value="all">All senders</option>'+senders.map(s=>`<option>${E(s)}</option>`).join('');
function renderMessages(){const all=D.messages.filter(m=>(state.conversation==='all'||m.conversation===state.conversation)&&(state.sender==='all'||m.sender===state.sender));$('#conversation-filter').value=state.conversation;$('#sender-filter').value=state.sender;$$('[data-filter-thread]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filterThread===state.conversation)));$('#message-count').textContent=`${all.length} of ${D.messages.length} messages shown`;$('#message-list').innerHTML=all.map(m=>`<article class="message-record"><div class="message-meta"><span class="sender">${E(m.sender)}</span><span>${E(m.conversation)}</span></div><time>${E(m.timeLabel)} · ${E(m.timeBasis)}</time><p>${E(m.text)}</p><div class="message-source">${E(m.source)}</div><button class="text-button" type="button" data-message="${E(m.id)}">Inspect source & context ↗</button></article>`).join('')||'<p class="empty">No messages match these filters.</p>';}
$('#scene-gallery').innerHTML=D.photos.map(p=>`<button class="gallery-card" type="button" data-photo="${E(p.path)}"><img src="${p.image}" alt="${E(p.title)}"><strong>${E(p.title)}</strong><span>${E(p.path)}</span></button>`).join('');
$('#source-grid').innerHTML=D.files.map(f=>`<article class="source-file"><h4>${E(f.path)}</h4><span class="mono muted">${f.derivedFrom?'Unreviewed machine transcript · ':'Original file · '}${f.bytes.toLocaleString()} bytes · SHA-256 verified</span><div class="hash">${f.sha256}</div><div class="file-actions"><button class="text-button" type="button" data-file="${E(f.path)}">Inspect source ↗</button><a href="${href(f.path)}" download>${f.derivedFrom?'Derived transcript':'Original file'} ↓</a></div></article>`).join('');
function navigate(view){if(!views.includes(view))return;state.view=view;$$('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==view);$$('.nav [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(view!=='briefing')$('#briefing-video')?.pause();requestAnimationFrame(cords);}
function clicks(e){const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.view)navigate(d.view);else if(d.person)person(d.person);else if(d.photo)photo(d.photo);else if(d.conversation)conversation(d.conversation);else if(d.message)message(d.message);else if(d.record)record(d.record);else if(d.file)source(d.file);else if(d.filterThread){state.conversation=d.filterThread;state.sender='all';renderMessages();}else if(d.openThread){state.conversation=d.openThread;state.sender='all';renderMessages();dialog.close();navigate('messages');$('#conversation-filter').focus();}else if(d.sender){state.sender=d.sender;state.conversation='all';renderMessages();}else if(d.reset){state.sender='all';state.conversation='all';renderMessages();}}
root.addEventListener('click',clicks);dialog.addEventListener('click',clicks);dialog.querySelector('.dialog-close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
for(const [id,key] of [['#conversation-filter','conversation'],['#sender-filter','sender']])$(id).addEventListener('change',e=>{state[key]=e.target.value;renderMessages();});
renderMessages();navigate('room');new ResizeObserver(cords).observe(root);window.addEventListener('load',cords);
})();
</script></body></html>
