<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · Video briefing</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101815;color:#e2e7d8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1260px;margin:0 auto;padding:30px 28px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:25px;border-bottom:1px solid #405039}.brand{font:12px/1.5 ui-monospace,monospace;letter-spacing:1.7px;color:#b5c1a6}.pill{font-size:11px;border:1px solid #647453;padding:7px 12px;color:#cad6bd}.intro{padding:28px 0 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}h1{font-size:35px;line-height:1.15;letter-spacing:-1px;font-weight:500;margin:4px 0 10px}p{margin:0;color:#aebda2}.duration{font:12px/1.5 ui-monospace,monospace;letter-spacing:1px}.player{background:#070c09;border:1px solid #536346;box-shadow:0 18px 60px #0005}video{width:100%;display:block;aspect-ratio:16/9;background:#0d1510}.links{display:flex;gap:12px;flex-wrap:wrap;padding:18px 0 26px}a,button{color:inherit}a{text-underline-offset:4px}button,.links a{padding:10px 14px;border:1px solid #5b6c4f;background:#263723;text-decoration:none;font:13px/1.4 inherit;border-radius:3px}button{cursor:pointer}.links a.primary{background:#dddcca;color:#1c2618;border-color:#dddcca}.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:9px 0 27px}.chapter{text-align:left;padding:13px;background:#1c2a1d;color:#ccd5c2;border:1px solid #42563a;font-size:13px;line-height:1.4}.chapter[aria-current=true]{border-color:#d6bb7c;background:#343c25}.chapter .time{display:block;font:11px/1.5 ui-monospace,monospace;color:#c5ad70;margin-bottom:7px}h2{font-size:19px;font-weight:500;margin:15px 0 12px}details{margin-top:27px;border-top:1px solid #425339;padding-top:20px}summary{cursor:pointer;color:#d4ddc7}.transcript{max-width:930px;padding:14px 0}.transcript section{margin:21px 0 27px}.transcript h3{font-size:17px;font-weight:500}.transcript p{line-height:1.8;color:#c5d0bc}.transcript small{color:#96aa87;display:block;margin-top:9px;font:11px/1.5 ui-monospace,monospace}.note{font-size:12px;line-height:1.7;color:#95a989}.now{padding:12px 15px;font-size:12px;border-top:1px solid #35492f;background:#19291b;color:#b8c9ac}.time-badge{color:#d1b775}button:focus-visible,a:focus-visible{outline:3px solid #9fcea9;outline-offset:3px}@media(max-width:650px){main{padding:20px 15px 40px}header{align-items:flex-start;gap:15px}.brand{font-size:10px;letter-spacing:1px}.pill{font-size:9px}h1{font-size:29px}.intro{display:block}.duration{margin-top:12px}.chapters{grid-template-columns:1fr 1fr}.links a{font-size:12px;padding:9px 11px}.note{font-size:11px}}
</style></head><body><main>
<header><div class="brand">VIRTUAL DETECTIVE ROOM<br>CASE DETECTIVE TEAM</div><div class="pill">{{STATUS}}</div></header>
<div class="intro"><div><div class="brand">{{SUBTITLE}}</div><h1>{{TITLE}}</h1><p>{{FOCUS}}</p></div><div class="duration" id="duration"></div></div>
<div class="player"><video id="film" controls playsinline preload="metadata" poster="Case-Overview-Poster.jpg" aria-label="{{TITLE}} with visible captions"><source src="Case-Overview.mp4" type="video/mp4">Your browser does not support this video. <a href="Case-Overview.mp4">Open the MP4.</a></video><div class="now" id="now" aria-live="polite">Ready to play · {{VOICE}}</div></div>
<div class="links"><a class="primary" href="Evidence-Register.html">Evidence register ↗</a><a href="Case-Overview.mp4" download>Save video</a><a href="Case-Overview-Voiceover.m4a" download>Voiceover only</a><a href="Case-Overview-Transcript.md" download>Transcript</a></div>
<h2>Jump to a chapter</h2><div class="chapters" id="chapters"></div>
<p class="note">{{NOTE}}</p>
<details><summary>Read the complete narration and sources</summary><div class="transcript" id="transcript"></div></details>
<script>
const timing=/*__TIMING__*/;
const scenes=/*__SCENES__*/;
const film=document.getElementById('film');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
document.getElementById('duration').textContent=`${clock(timing.duration)} / 1080P / CAPTIONED`;
document.getElementById('chapters').innerHTML=timing.chapters.map((c,i)=>`<button class="chapter" type="button" data-time="${c.start}" aria-current="false"><span class="time">${clock(c.start)} · ${String(i+1).padStart(2,'0')}</span>${E(c.title)}</button>`).join('');
document.getElementById('transcript').innerHTML=scenes.map(s=>`<section><h3>${E(s.chapter)} — ${E(s.title)}</h3><p>${E(s.narration)}</p><small>Source: ${E(s.source)}</small></section>`).join('');
let current=-1;
function showChapter(i){if(i<0||i===current)return;current=i;document.querySelectorAll('.chapter').forEach((b,n)=>b.setAttribute('aria-current',String(n===i)));document.getElementById('now').textContent=`${clock(timing.chapters[i].start)} · ${timing.chapters[i].title}`;}
document.getElementById('chapters').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const time=Number(b.dataset.time);film.currentTime=time;showChapter(timing.chapters.findIndex(c=>c.start===time));try{await film.play()}catch(err){document.getElementById('now').textContent='Chapter selected. Press Play to start.'}});
film.addEventListener('timeupdate',()=>showChapter(timing.chapters.findIndex(c=>film.currentTime>=c.start&&film.currentTime<c.end)));
film.addEventListener('error',()=>{document.getElementById('now').textContent='The MP4 could not be opened. Keep this page and Case-Overview.mp4 in the same folder.'});
</script></main></body></html>
