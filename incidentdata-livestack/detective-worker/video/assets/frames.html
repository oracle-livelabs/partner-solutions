<!doctype html><html lang="en"><meta charset="utf-8"><title>Detective video frames</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#16201b;color:#e6e8da;font:26px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 70% 20%,#56644750,transparent 65%),repeating-linear-gradient(90deg,transparent 0,transparent 319px,#71826a12 320px),radial-gradient(#b7c5a91a .8px,transparent 1px),#17201c;background-size:auto,auto,5px 5px,auto}.scene{display:none;position:absolute;inset:0;padding:65px 88px 165px}.scene.active{display:block}.topline{display:flex;justify-content:space-between;align-items:center;font:18px/1.4 ui-monospace,monospace;letter-spacing:2px;color:#b7c7aa;margin-bottom:45px;text-transform:uppercase}.badge{border:1px solid #788767;padding:8px 14px;font-size:15px}.kicker{font:19px/1.5 ui-monospace,monospace;color:#d3b879;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}h1{font-size:76px;line-height:1.02;letter-spacing:-2px;font-weight:550;margin:15px 0 26px}h2{font-size:50px;line-height:1.12;font-weight:500;letter-spacing:-1px;margin:0 0 30px}h3{font-size:28px;line-height:1.2;font-weight:550;margin:0 0 13px}p{margin:0}.muted{color:#b7c8aa}.small{font-size:20px}.mono{font-family:ui-monospace,monospace}.tag{display:inline-block;padding:8px 13px;border:1px solid #778565;background:#273a2a;font:18px/1.5 ui-monospace,monospace}.source{position:absolute;left:88px;right:88px;bottom:128px;border-top:1px solid #506248;padding-top:17px;display:flex;justify-content:space-between;gap:25px;color:#a6b79b;font:16px/1.5 ui-monospace,monospace}.source span:first-child{max-width:1490px}.body{height:620px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:42px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.card{border:1px solid #657657;background:#273629;padding:27px}.paper{background:#e5dec8;color:#273228;padding:13px;box-shadow:8px 10px 20px #0006;position:relative}.paper:before{content:"";position:absolute;top:6px;left:50%;width:10px;height:10px;background:#b76852;border-radius:50%;z-index:2}.paper img{width:100%;display:block;object-fit:cover}.paper h3{margin:15px 6px 8px}.paper p{font-size:18px;margin:0 6px}.number{color:#e1c27f;font-size:66px;line-height:1.1;font-weight:500}.footnote{margin-top:24px;color:#bdcbb1;font-size:22px;line-height:1.5}.quote{padding:22px 29px;border-left:4px solid #83b8b0;background:#20342b;font-size:27px;line-height:1.45}.quote small{display:block;font:17px/1.5 ui-monospace,monospace;color:#9bbfae;margin-top:12px}.list-row{display:flex;gap:26px;padding:21px 0;border-bottom:1px solid #4b6244}.list-row .n{font:36px/1.1 ui-monospace,monospace;color:#d4b478}.list-row p{font-size:22px;color:#b7c9a8}.rule{border-top:1px solid #5c6e50;margin:23px 0}.metrics{display:flex;gap:45px;flex-wrap:wrap}.metrics .number{font-size:46px}.metrics p{font-size:20px;color:#b6c6a7}svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{display:grid;grid-template-columns:550px 1fr;gap:55px;align-items:center;height:630px}.hero h1{font-size:83px}.hero .lead{font-size:30px;line-height:1.4;color:#ccd6c1;margin:25px 0}.hero .board{height:584px;position:relative;background:#223025;border:12px solid #424b3b;box-shadow:10px 20px 40px #0008;padding:20px}.hero .board .paper{position:absolute;width:46%;padding:9px}.hero .board img{height:208px}.hero .board p{font-size:15px}.hero .board svg{position:absolute;inset:0;width:100%;height:100%}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.timeline .card{border-top:4px solid #bca068;min-height:420px}.timeline .month{font:24px/1.5 ui-monospace,monospace;color:#dbc186;margin-bottom:20px}.timeline p{font-size:25px;line-height:1.5}.route{display:flex;align-items:center;gap:18px;padding:25px;border-bottom:1px solid #526548}.route .place{font-size:32px;color:#e4d2a5;min-width:250px}.route .date{font:20px/1.5 ui-monospace,monospace;color:#c3d0b7;min-width:180px}.route .detail{font-size:23px;color:#bed0b2}
.hero{height:620px}
</style><body><div id="frames"></div><script>
const C=/*__CASE__*/;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#frames').innerHTML=C.scenes.map((s,i)=>`<section class="scene ${i===0?'active':''}" data-id="${E(s.id)}"><div class="topline"><span>VIRTUAL DETECTIVE ROOM · VIDEO BRIEFING</span><span class="badge">${C.synthetic?'SYNTHETIC TRAINING CASE':'INVESTIGATION BRIEFING'}</span></div>${s.hero?'':`<div class="kicker">${E(s.chapter)}</div><h2>${E(s.title)}</h2>`}<div class="body">${s.html}</div><div class="source"><span>${E(s.displaySource||s.source)}</span><span>${String(i+1).padStart(2,'0')} / ${String(C.scenes.length).padStart(2,'0')}</span></div></section>`).join('');
window.showScene=id=>document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('active',s.dataset.id===id));
</script></body></html>
